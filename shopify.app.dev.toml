# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9f79e1ab580c4a996ca2e6b6b3f62ddb"
name = "TRENDS API"
application_url = "https://dev.nazmulcodes.org/app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_metaobject_definitions,write_metaobjects,write_products,read_locations,write_inventory,read_inventory,read_publications,write_publications"

[auth]
redirect_urls = [
  "https://dev.nazmulcodes.org/api/auth",
  "https://dev.nazmulcodes.org/api/auth/callback",
  "https://dev.nazmulcodes.org/auth/callback",
  "https://dev.nazmulcodes.org/auth/shopify/callback"
]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.trends_api]
name = "TRENDS API"
description = "A metaobject definition created for TRENDS API"

  [metaobjects.app.trends_api.access]
  admin = "merchant_read_write"

[metaobjects.app.trends_api.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.trends_api.fields.description]
name = "Description"
type = "multi_line_text_field"
